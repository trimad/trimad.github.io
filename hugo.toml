baseURL = 'https://trimad.github.io'
locale = 'en-US'
title = 'Ghost Graph'

theme = "pretext"

relativeURLs = false
canonifyURLs = true

enableGitInfo = true

[module]
  [module.hugoVersion]
    min = "0.159.1"

[related]
  includeNewer = true
  threshold = 25
  toLower = true
  [[related.indices]]
    name = "tags"
    type = "basic"
    applyFilter = false
    cardinalityThreshold = 0
    pattern = ""
    toLower = true
    weight = 100
  [[related.indices]]
    name = "categories"
    type = "basic"
    applyFilter = false
    cardinalityThreshold = 0
    pattern = ""
    toLower = true
    weight = 80
  [[related.indices]]
    name = "keywords"
    type = "basic"
    applyFilter = false
    cardinalityThreshold = 0
    pattern = ""
    toLower = true
    weight = 40

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[params]
  description = "Technical notes, prompts, diagnostics, and archived material."
  # Add other site-wide parameters here

# Enable robots.txt and sitemap generation (usually enabled by default)
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        title = true
        block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
    ordered = false
