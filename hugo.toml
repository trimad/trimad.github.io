baseURL = 'https://trimad.github.io'
languageCode = 'en-us'
title = 'Ghost Graph'

theme = "Rei"

relativeURLs = false
canonifyURLs = true

enableGitInfo = true

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[params]
  description = "Technical notes, prompts, diagnostics, and archived material."
  # Add other site-wide parameters here

# Enable robots.txt and sitemap generation (usually enabled by default)
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
    ordered = false
