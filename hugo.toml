baseURL = 'https://trimad.github.io'
languageCode = 'en-us'
title = 'Ghost Graph'

theme = "Ghost Graph"

relativeURLs = false
canonifyURLs = true

enableGitInfo = true

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[params]
  description = "Ghost Graph: Interlinked notes, diagnostics, and proven scripts rendered as a navigable 3D graph."
  # Add other site-wide parameters here

# Enable robots.txt and sitemap generation (usually enabled by default)
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
