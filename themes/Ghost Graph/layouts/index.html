{{ define "main" }}
{{ if .IsHome }}
  <meta http-equiv="refresh" content="0; url={{ "/posts/" | relURL }}">
  <script>
    window.location.replace("{{ "/posts/" | relURL }}");
  </script>
  <p>Redirecting to the <a href="{{ "/posts/" | relURL }}">Posts section</a>…</p>
{{ else }}
  {{ .Scratch.Set "showGraph" true }}
  <div class="sv-shell">
    {{ partial "site-header.html" . }}
    <div class="sv-layout sv-layout-map">
      <main class="sv-main">
        {{ partial "dag.html" (dict "page" . "focusKind" "" "focusValue" "" "contentId" "content") }}
      </main>
    </div>
  </div>
{{ end }}
{{ end }}
