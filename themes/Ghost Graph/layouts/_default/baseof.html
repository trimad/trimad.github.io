<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="sv-body">
    <a class="sv-skip" href="#content">Skip to content</a>
    {{ block "main" . }}{{ end }}
    {{- if .Scratch.Get "showGraph" -}}
      {{ partial "dag-data.html" . }}
      <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.min.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.min.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
            "3d-force-graph": "https://esm.sh/3d-force-graph@1.79.0?external=three"
          }
        }
      </script>
      {{- $js := resources.Get "js/dag.js" | minify | fingerprint -}}
      <script type="module" src="{{ $js.RelPermalink }}"></script>
    {{- end -}}
    <script src="{{ "js/code-copy.js" | relURL }}" defer></script>
  </body>
</html>
