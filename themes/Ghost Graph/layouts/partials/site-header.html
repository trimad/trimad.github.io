<header class="sv-header">
  <div class="sv-brand">
    <a class="sv-mark" href="{{ "/" | relURL }}">GG</a>
    <div class="sv-brand-text">
      <div class="sv-title">{{ .Site.Title }}</div>
      <div class="sv-subtitle">{{ .Site.Params.description | default "Voronoi index" }}</div>
    </div>
  </div>
  <nav class="sv-nav" aria-label="Primary">
    <a class="sv-nav-link{{ if and (not .IsPage) (or (eq .Section "posts") (and .IsHome (eq .Kind "home"))) }} is-active{{ end }}" href="{{ "/posts/" | relURL }}">Posts</a>
    <a class="sv-nav-link{{ if and (not .IsPage) (eq .Section "prompts") }} is-active{{ end }}" href="{{ "/prompts/" | relURL }}">Prompts</a>
    <a class="sv-nav-link{{ if and (not .IsPage) (eq .Section "archive") }} is-active{{ end }}" href="{{ "/archive/" | relURL }}">Archive</a>
  </nav>
</header>
