{{- $pages := where .Site.RegularPages "Section" "ne" "archive" -}}
{{- $recent := first 16 (sort $pages "Lastmod" "desc") -}}
<aside class="sv-sidebar" aria-label="Recently modified">
  <div class="sv-sidebar-title">Recently Modified</div>
  <ul class="sv-sidebar-list">
    {{- range $recent -}}
      <li class="sv-sidebar-item">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time class="sv-sidebar-date" datetime="{{ .Lastmod.Format "2006-01-02" }}">
          {{ .Lastmod.Format "Jan 2, 2006" }}
        </time>
      </li>
    {{- else -}}
      <li class="sv-sidebar-item"><span>No posts yet.</span></li>
    {{- end -}}
  </ul>
</aside>
